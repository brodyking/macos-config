set -g mouse
setw -g pane-base-index 1
set -g base-index 1


set-option -g allow-rename off

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'theutz/tmux-tokyonight-nvim'


# Set default shell inside tmux to zsh
set -g default-shell /bin/zsh

# Fix truecolor rendering (resolves yellow color fallback)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"


set -g status-position top 
set -g status-interval 5
set -g status-style 'fg=default bg=default'
set -g message-style 'fg=default,bg=default'
set -g message-command-style reverse

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

bind C-l send-keys 'C-l'
set -g assume-paste-time 0
bind-key -n C-h send-keys C-h



# set -g status-left-length 20
# set -g status-left "#S "

set -g status-justify absolute-centre
setw -g window-status-current-style 'fg=green bg=default'
setw -g window-status-style 'fg=default'
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"

set -g status-right ""


set -g pane-border-lines simple
set -g pane-border-style fg=colour241
set -g pane-active-border-style fg=colour39
